<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Language - FarmConnect</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" style="max-width:550px; margin-top:12vh;">
        <div class="text-center mb-3">
            <h1 style="font-size:2.5rem; color:var(--dark-green);">🌱 FarmConnect</h1>
            <p style="margin-top:1rem; font-size:1.1rem; color:#555;">
                Please select your preferred language<br>
                कृपया अपनी भाषा चुनें | ದಯವಿಟ್ಟು ನಿಮ್ಮ ಭಾಷೆ ಆಯ್ಕೆಮಾಡಿ<br>
                உங்கள் மொழியை தேர்வு செய்க | നിങ്ങളുടെ ഭാഷ തിരഞ്ഞെടുക്കുക
            </p>
        </div>
        <div class="lang-grid">
            <div class="lang-card" onclick="setLang('en')">🇬🇧 English</div>
            <div class="lang-card" onclick="setLang('hi')">🇮🇳 हिंदी</div>
            <div class="lang-card" onclick="setLang('ka')">🇮🇳 ಕನ್ನಡ</div>
            <div class="lang-card" onclick="setLang('ta')">🇮🇳 தமிழ்</div>
            <div class="lang-card" onclick="setLang('ml')">🇮🇳 മലയാളം</div>
        </div>
    </div>
    <script>
        function setLang(code) {
            localStorage.setItem('farmLang', code);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
